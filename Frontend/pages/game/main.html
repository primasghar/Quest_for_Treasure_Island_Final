<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Quest for Treasure Island</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
    <!--    <link rel="manifest" href="../../favicon/site.webmanifest">-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@400;600&family=Poppins:wght@400;500&family=Special+Elite&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.1.0/dist/confetti.min.js"></script>
    <script src="game.js" type="module" defer></script>
</head>
<body>
<div class="wrapper">
    <header>
        <img class="logoImg" src="../../images/logoImg1.png" alt="game logo">
        <h1>A Legendary Quest</h1>
    </header>
    <main class="main">
        <section class="mapAndScoreSection">
            <section id="map"></section>
            <section class="scoreBoard">
                <div class="board">
                    <div class="nameAndLevel">
                        <div class="nameAndId">
                            <h2 class="name"></h2>
                            <div class="idDiv">
                                <span>Player ID:</span>
                                <span class="id"></span>
                            </div>
                        </div>
                        <div class="levelAndAttempts">
                            <div class="levelBadge">
                                <p class="levelTitle">Level:</p>
                                <p class="level"></p><span>/8</span>
                            </div>
                            <div class="attemptsBadge">
                                <p class="attemptsTitle">Attempts:</p>
                                <p class="attempts"></p><span>/3</span>
                            </div>
                        </div>

                    </div>
                    <div class="collectibles">
                        <div class="collectibleWrap">
                            <div class="collectible" data-id="compass">
                                <i class="ti ti-compass outline-icon" aria-hidden="true"></i>
                                <i class="ti ti-compass filled-icon" aria-hidden="true"></i>
                            </div>
                            <div class="label">compass</div>
                        </div>
                        <div class="collectibleWrap">
                            <div class="collectible" data-id="coin">
                                <i class="ti ti-coin outline-icon" aria-hidden="true"></i>
                                <i class="ti ti-coin filled-icon" aria-hidden="true"></i>
                            </div>
                            <div class="label">coin</div>
                        </div>
                        <div class="collectibleWrap">
                            <div class="collectible" data-id="key">
                                <i class="ti ti-key outline-icon" aria-hidden="true"></i>
                                <i class="ti ti-key filled-icon" aria-hidden="true"></i>
                            </div>
                            <div class="label">key</div>
                        </div>
                        <div class="collectibleWrap">
                            <div class="collectible" data-id="gem">
                                <i class="ti ti-diamond outline-icon" aria-hidden="true"></i>
                                <i class="ti ti-diamond filled-icon" aria-hidden="true"></i>
                            </div>
                            <div class="label">gem</div>
                        </div>
                        <div class="collectibleWrap">
                            <div class="collectible" data-id="anchor">
                                <i class="ti ti-anchor outline-icon" aria-hidden="true"></i>
                                <i class="ti ti-anchor filled-icon" aria-hidden="true"></i>
                            </div>
                            <div class="label">anchor</div>
                        </div>
                        <div class="collectibleWrap">
                            <div class="collectible" data-id="scroll">
                                <i class="ti ti-flame outline-icon" aria-hidden="true"></i>
                                <i class="ti ti-flame filled-icon" aria-hidden="true"></i>
                            </div>
                            <div class="label">Lantern</div>
                        </div>

                        <div class="collectibleWrap">
                            <div class="collectible" data-id="chest">
                                <i class="ti ti-box outline-icon" aria-hidden="true"></i>
                                <i class="ti ti-box filled-icon" aria-hidden="true"></i>
                            </div>
                            <div class="label">chest</div>
                        </div>

                        <div class="collectibleWrap">
                            <div class="collectible" data-id="map">
                                <i class="ti ti-map outline-icon" aria-hidden="true"></i>
                                <i class="ti ti-map filled-icon" aria-hidden="true"></i>
                            </div>
                            <div class="label">map</div>

                        </div>

                    </div>
                    <div class="scoreAndCarb">
                        <div class="carbonDiv">
                            <h3 class="carbHeading">Carbon Footprint</h3>
                            <p class="carbon"></p>
                        </div>
                        <div class="scoreDiv">
                            <h3 class="scoreHeading">Score</h3>
                            <p class="score"></p>
                        </div>
                    </div>

                </div>
            </section>
        </section>
        <section class="gameAndResultSection">
            <div class="gameTitleDiv">
                <h2 class="gameNameHeading"></h2>
                <div class="gameTitleTopText"><i class="ti ti-plane"></i>
                    <p class="arrivalText">arrived at <span class="airportName"></span><span class="countryFlag"></span>
                    </p></div>
                <p class="instructionText">Win the game to earn your next boarding pass. You have 3 attempts before the gate
                    closes.</p>
            </div>

            <div class="gameArea"></div>
            <div class="showResult">
            </div>
            <div class="buttons">
                <button class="quitBtn"><span class="iconAndTextBtn"><i class="ti ti-x"></i>Quit</span></button>
                <!--                <button class="playAgain"><span class="iconAndTextBtn"><i class="ti ti-refresh"></i>Replay</span></button>-->
                <button class="playNextBtn"><span class="iconAndTextBtn"><i
                        class="ti ti-plane-departure"></i>Next</span>
                </button>
            </div>
        </section>

    </main>
</div>

</body>
</html>
