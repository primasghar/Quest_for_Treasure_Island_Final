<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Quest for Treasure Island</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../favicon/favicon-16x16.png">
    <link rel="manifest" href="../../favicon/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <!--    <script src="levels/levelOne.js" defer></script>-->
    <!--    <script src="levels/levelTwo.js" defer></script>-->
    <!--    <script src="levels/levelThree.js" defer></script>-->
<!--    <script src="levels/levelFour.js" defer></script>-->
    <script src="levels/levelFive.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
<div class="wrapper">
    <header>
        <img class="logoImg" src="../../images/logoImg1.png" alt="game logo">
        <h1>A Legendary Quest</h1>
    </header>
    <main class="main">
        <section class="partOne">
            <section class="map">Map</section>
            <section class="scoreBoard">
                <h3 class="scoreBoardHeading">Score Board</h3>
                <table class="table">
                    <tr class="tRow">
                        <th>Player name</th>
                        <td class="name"></td>
                    </tr>
                    <tr class="tRow">
                        <th>Game level</th>
                        <td class="level"></td>
                    </tr>
                    <tr class="tRow">
                        <th>Carbon Footprints</th>
                        <td class="carbon"></td>
                    </tr>
                    <tr class="tRow">
                        <th>Total Score</th>
                        <td class="score"></td>
                    </tr>
                </table>
                <!--                <ul class="scoreBoardList">-->
                <!--                    <li>Player name:&nbsp<span class="name"></span></li>-->
                <!--                    <li>Game level:&nbsp<span class="level"></span></li>-->
                <!--                    <li>Carbon Footprints:&nbsp<span class="carbon"></span></li>-->
                <!--                    <li>Total Score:&nbsp<span class="score"></span></li>-->
                <!--                </ul>-->

                <p class="player"><span></span></p>
            </section>
        </section>
        <section class="partTwo">
            <h2 class="gameNameHeading"></h2>
            <div class="gameArea">
                <p class="gameDescription"></p>
            </div>
            <div class="showResult">
                <span class="resultHeading">Result </span><span class="trials"></span>
                <span class="player"></span><span class="computer"></span>
                <p class="result"></p>
            </div>
        </section>
        <div class="buttons">
            <button class="quit">Quit</button>
            <button class="playNext">Play Next</button>

        </div>
    </main>
</div>

</body>
</html>
